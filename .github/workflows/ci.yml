name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        build: [Debug, Release]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884
        id: msys2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-ninja
      - name: Configure
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $ErrorActionPreference = 'Stop'
          $compilerBin = Join-Path $env:MSYS2_LOCATION 'ucrt64\bin'
          $compilerBin | Out-File -FilePath $env:GITHUB_PATH -Append
          $env:PATH = $compilerBin + ';' + $env:PATH
          if ((& g++ -dumpfullversion) -ne '16.2.0') { throw 'Expected GCC 16.2.0' }
          python -m pip install cmake==4.4.2 conan==2.31.2 openapi-spec-validator==0.9.0
          if ($LASTEXITCODE -ne 0) { throw 'Dependency setup failed' }
          conan profile detect --force
          conan install . --output-folder=build/conan/ci --build=missing -s compiler=gcc -s compiler.version=16 -s compiler.libcxx=libstdc++11 -s compiler.cppstd=26 -s build_type=${{ matrix.build }}
          if ($LASTEXITCODE -ne 0) { throw 'Conan install failed' }
          cmake -S . -B build/ci -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build }} "-DCMAKE_CXX_COMPILER=$compilerBin/g++.exe" -DCMAKE_TOOLCHAIN_FILE="$PWD/build/conan/ci/conan_toolchain.cmake" -DFLASH_WARNINGS_AS_ERRORS=ON
          if ($LASTEXITCODE -ne 0) { throw 'Configure failed' }
      - name: Build
        run: cmake --build build/ci --parallel 2
      - name: Test
        run: ctest --test-dir build/ci --output-on-failure
  linux:
    runs-on: ubuntu-latest
    container: gcc:16.2.0
    timeout-minutes: 45
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 python3-venv ninja-build
          python3 -m venv /tmp/flash-ci-python
          /tmp/flash-ci-python/bin/pip install cmake==4.4.2 conan==2.31.2 openapi-spec-validator==0.9.0
          echo /tmp/flash-ci-python/bin >> "$GITHUB_PATH"
      - name: Configure
        run: |
          test "$(g++ -dumpfullversion)" = 16.2.0
          conan profile detect --force
          conan install . --output-folder=build/conan/ci --build=missing -s compiler.cppstd=26 -s build_type=Debug
          cmake -S . -B build/ci -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=g++ -DCMAKE_TOOLCHAIN_FILE="$PWD/build/conan/ci/conan_toolchain.cmake" -DFLASH_SANITIZERS=ON -DFLASH_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build/ci --parallel 2
      - name: Test
        run: ctest --test-dir build/ci --output-on-failure
